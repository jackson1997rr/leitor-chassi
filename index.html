<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Leitor de Código de Barras</title>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .status {
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: black;
      border: 2px solid #374151;
    }

    video {
      width: 100%;
      display: block;
      min-height: 300px;
      object-fit: cover;
    }

    .linha {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 3px;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    .instrucao {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .resultado {
      margin-top: 20px;
      padding: 20px;
      background: #1f2937;
      border-radius: 12px;
    }

    .resultado small {
      color: #9ca3af;
    }

    #codigo {
      margin-top: 8px;
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
      color: #22c55e;
    }

    #mensagem {
      margin-top: 15px;
      font-size: 14px;
      color: #fbbf24;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Leitor de Código de Barras</h1>

  <div class="status">
    Aponte a câmera para o código do chassi
  </div>

  <div class="camera-box">

    <video id="video"
           autoplay
           playsinline>
    </video>

    <div class="linha"></div>

  </div>

  <div class="instrucao">
    Posicione o código de barras atravessando a linha vermelha.
  </div>

  <button id="btnCamera">
    ABRIR CÂMERA
  </button>

  <div class="resultado">

    <small>CÓDIGO LIDO</small>

    <div id="codigo">
      Aguardando leitura...
    </div>

  </div>

  <div id="mensagem"></div>

</div>


<script>

const video = document.getElementById("video");
const codigo = document.getElementById("codigo");
const mensagem = document.getElementById("mensagem");
const btnCamera = document.getElementById("btnCamera");

let leitor = null;
let lendo = false;


// ------------------------------------
// ABRIR CÂMERA
// ------------------------------------

btnCamera.addEventListener("click", iniciarLeitor);


async function iniciarLeitor() {

  if (lendo) {
    return;
  }

  lendo = true;

  btnCamera.innerText = "INICIANDO CÂMERA...";

  codigo.innerText = "Procurando código...";

  mensagem.innerText =
    "Permita o acesso à câmera quando o navegador solicitar.";

  try {

    // Configuração para priorizar CODE 128
    const hints = new Map();

    const formatos = [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E
    ];

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      formatos
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );


    leitor =
      new ZXing.BrowserMultiFormatReader(hints);


    // Procurar câmeras disponíveis
    const cameras =
      await ZXing.BrowserCodeReader.listVideoInputDevices();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "Nenhuma câmera encontrada."
      );

    }


    // Normalmente a última câmera é a traseira
    let cameraSelecionada =
      cameras[cameras.length - 1];


    // Tentar encontrar explicitamente câmera traseira
    const traseira = cameras.find(camera => {

      const nome =
        (camera.label || "").toLowerCase();

      return (
        nome.includes("back") ||
        nome.includes("rear") ||
        nome.includes("traseira") ||
        nome.includes("environment")
      );

    });


    if (traseira) {
      cameraSelecionada = traseira;
    }


    mensagem.innerText =
      "Câmera aberta. Procurando código de barras...";

    btnCamera.innerText =
      "CÂMERA ATIVA";


    // ------------------------------------
    // LEITURA CONTÍNUA
    // ------------------------------------

    leitor.decodeFromVideoDevice(
      cameraSelecionada.deviceId,
      video,
      (resultado, erro) => {

        if (resultado) {

          const texto =
            resultado.getText();

          codigo.innerText = texto;

          mensagem.innerText =
            "Código identificado com sucesso!";

          // Vibração curta
          if (navigator.vibrate) {
            navigator.vibrate(150);
          }

        }

        if (erro &&
            !(erro instanceof ZXing.NotFoundException)) {

          console.log(erro);

        }

      }
    );


  } catch (erro) {

    console.error(erro);

    lendo = false;

    btnCamera.innerText =
      "TENTAR NOVAMENTE";

    codigo.innerText =
      "Câmera não iniciada";

    mensagem.innerText =
      "Erro: " + erro.message;

  }

}

</script>

</body>
</html>
