<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Leitor de Código de Barras</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 18px;
  text-align: center;
}

h1 {
  font-size: 25px;
  margin: 12px 0 5px;
}

.subtitulo {
  color: #cbd5e1;
  margin-bottom: 18px;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 390px;
  overflow: hidden;
  border-radius: 16px;
  background: black;
  border: 2px solid #334155;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mira {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  height: 150px;

  border: 3px solid #f59e0b;
  border-radius: 10px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,0.25);

  pointer-events: none;
}

.linha {
  position: absolute;
  left: 3%;
  right: 3%;
  top: 50%;

  height: 3px;

  background: #ef4444;

  box-shadow:
    0 0 12px #ef4444;
}

.instrucao {
  color: #cbd5e1;
  margin: 15px 0;
  font-size: 14px;
  line-height: 1.4;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;

  border: 0;
  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;

  color: white;
}

#btnCamera {
  background: #2563eb;
}

#btnCapturar {
  background: #059669;
}

#btnCapturar:disabled {
  background: #475569;
}

.resultado {
  margin-top: 20px;
  padding: 22px;

  background: #1e293b;

  border-radius: 14px;
}

.label {
  color: #94a3b8;
  font-size: 13px;
}

#codigo {
  margin-top: 10px;

  color: #22c55e;

  font-size: 25px;
  font-weight: bold;

  word-break: break-all;
}

#formato {
  margin-top: 8px;

  color: #38bdf8;
}

#mensagem {
  margin-top: 17px;
  padding-bottom: 20px;

  color: #fbbf24;

  font-size: 14px;
  line-height: 1.4;
}

#motor {
  margin-top: 7px;

  color: #94a3b8;

  font-size: 12px;
}

canvas {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>Leitor de Código de Barras</h1>

<div class="subtitulo">
  Centralize o código dentro da área amarela
</div>


<div class="camera-box">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div class="mira">
    <div class="linha"></div>
  </div>

</div>


<div class="instrucao">
  Mantenha todas as barras visíveis e deixe
  a câmera focar antes de capturar.
</div>


<button id="btnCamera">
  ABRIR CÂMERA
</button>


<button id="btnCapturar" disabled>
  CAPTURAR E LER
</button>


<div class="resultado">

  <div class="label">
    CÓDIGO LIDO
  </div>

  <div id="codigo">
    Aguardando...
  </div>

  <div id="formato"></div>

  <div id="motor"></div>

</div>


<div id="mensagem">
  Abra a câmera para começar.
</div>


<canvas id="canvas"></canvas>

</div>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const btnCamera =
  document.getElementById("btnCamera");

const btnCapturar =
  document.getElementById("btnCapturar");

const codigo =
  document.getElementById("codigo");

const formato =
  document.getElementById("formato");

const mensagem =
  document.getElementById("mensagem");

const motor =
  document.getElementById("motor");


let stream = null;

let detector = null;

let leituraAutomatica = null;

let processando = false;

let ultimoCodigo = "";


// ==========================================
// VERIFICAR BARCODE DETECTOR
// ==========================================

async function prepararDetector() {

  if (!("BarcodeDetector" in window)) {

    motor.innerText =
      "BarcodeDetector não disponível neste navegador.";

    return false;

  }


  try {

    const suportados =
      await BarcodeDetector.getSupportedFormats();


    console.log(
      "Formatos disponíveis:",
      suportados
    );


    const desejados = [

      "ean_13",

      "ean_8",

      "code_128",

      "code_39",

      "code_93",

      "codabar",

      "itf",

      "upc_a",

      "upc_e"

    ];


    const formatosValidos =
      desejados.filter(
        item => suportados.includes(item)
      );


    if (formatosValidos.length === 0) {

      motor.innerText =
        "Nenhum formato 1D compatível encontrado.";

      return false;

    }


    detector =
      new BarcodeDetector({

        formats: formatosValidos

      });


    motor.innerText =
      "Motor: leitor nativo do navegador";


    return true;


  } catch (erro) {

    console.error(erro);

    motor.innerText =
      "Falha ao iniciar o leitor nativo.";

    return false;

  }

}


// ==========================================
// ABRIR CÂMERA
// ==========================================

btnCamera.addEventListener(
  "click",
  abrirCamera
);


async function abrirCamera() {

  btnCamera.disabled = true;

  btnCamera.innerText =
    "ABRINDO CÂMERA...";


  codigo.innerText =
    "Procurando código...";


  formato.innerText = "";


  mensagem.innerText =
    "Solicitando câmera traseira...";


  try {

    const detectorOk =
      await prepararDetector();


    if (!detectorOk) {

      throw new Error(
        "O navegador não disponibilizou o leitor de código necessário."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });


    video.srcObject =
      stream;


    await video.play();


    btnCamera.innerText =
      "CÂMERA ATIVA";


    btnCapturar.disabled =
      false;


    mensagem.innerText =
      "Leitura automática ativa. Aponte para o código.";


    iniciarLeituraAutomatica();


  } catch (erro) {

    console.error(erro);


    btnCamera.disabled =
      false;


    btnCamera.innerText =
      "TENTAR NOVAMENTE";


    codigo.innerText =
      "Leitor não iniciado";


    mensagem.innerText =
      "Erro: " + erro.message;

  }

}


// ==========================================
// LEITURA AUTOMÁTICA
// ==========================================

function iniciarLeituraAutomatica() {

  if (leituraAutomatica) {

    clearInterval(
      leituraAutomatica
    );

  }


  leituraAutomatica =
    setInterval(

      async function() {

        if (
          !detector ||
          processando ||
          video.readyState < 2
        ) {

          return;

        }


        processando = true;


        try {

          const resultados =
            await detector.detect(video);


          if (
            resultados &&
            resultados.length > 0
          ) {

            mostrarResultado(
              resultados[0]
            );

          }


        } catch (erro) {

          console.log(
            "Tentativa de leitura:",
            erro
          );

        }


        processando = false;

      },

      250

    );

}


// ==========================================
// MOSTRAR RESULTADO
// ==========================================

function mostrarResultado(item) {

  if (!item) {
    return;
  }


  const valor =
    item.rawValue || "";


  if (!valor) {
    return;
  }


  codigo.innerText =
    valor;


  formato.innerText =
    "Formato: " +
    (item.format || "identificado");


  mensagem.innerText =
    "Código identificado com sucesso!";


  if (
    valor !== ultimoCodigo
  ) {

    ultimoCodigo =
      valor;


    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        100,
        50,
        100
      ]);

    }

  }

}


// ==========================================
// CAPTURAR E LER
// ==========================================

btnCapturar.addEventListener(
  "click",
  capturarELer
);


async function capturarELer() {

  if (
    !detector ||
    !video.videoWidth
  ) {

    mensagem.innerText =
      "A câmera ainda não está pronta.";

    return;

  }


  mensagem.innerText =
    "Capturando imagem e analisando...";


  btnCapturar.disabled =
    true;


  try {

    const largura =
      video.videoWidth;

    const altura =
      video.videoHeight;


    canvas.width =
      largura;

    canvas.height =
      altura;


    const ctx =
      canvas.getContext(
        "2d",
        {
          willReadFrequently: true
        }
      );


    ctx.drawImage(
      video,
      0,
      0,
      largura,
      altura
    );


    // PRIMEIRA TENTATIVA:
    // imagem inteira

    let resultados =
      await detector.detect(
        canvas
      );


    if (
      resultados &&
      resultados.length > 0
    ) {

      mostrarResultado(
        resultados[0]
      );


      btnCapturar.disabled =
        false;


      return;

    }


    // SEGUNDA TENTATIVA:
    // somente faixa central

    const recorteLargura =
      Math.floor(
        largura * 0.95
      );


    const recorteAltura =
      Math.floor(
        altura * 0.45
      );


    const inicioX =
      Math.floor(
        (largura - recorteLargura) / 2
      );


    const inicioY =
      Math.floor(
        (altura - recorteAltura) / 2
      );


    const canvas2 =
      document.createElement(
        "canvas"
      );


    canvas2.width =
      recorteLargura;


    canvas2.height =
      recorteAltura;


    const ctx2 =
      canvas2.getContext(
        "2d"
      );


    ctx2.drawImage(

      canvas,

      inicioX,
      inicioY,

      recorteLargura,
      recorteAltura,

      0,
      0,

      recorteLargura,
      recorteAltura

    );


    resultados =
      await detector.detect(
        canvas2
      );


    if (
      resultados &&
      resultados.length > 0
    ) {

      mostrarResultado(
        resultados[0]
      );

    } else {

      codigo.innerText =
        "Não identificado";


      formato.innerText = "";


      mensagem.innerText =
        "Nenhum código foi identificado nesta captura.";

    }


  } catch (erro) {

    console.error(erro);


    mensagem.innerText =
      "Erro durante a leitura: " +
      erro.message;

  }


  btnCapturar.disabled =
    false;

}

</script>

</body>
</html>
