<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Leitor de Código de Barras</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

h1 {
  font-size: 25px;
  margin: 12px 0 5px;
}

.subtitulo {
  color: #cbd5e1;
  margin-bottom: 18px;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 380px;
  background: black;
  border: 2px solid #334155;
  border-radius: 16px;
  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Área onde queremos posicionar o código */

.mira {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  height: 145px;

  border: 3px solid #f59e0b;
  border-radius: 8px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,0.30);

  pointer-events: none;
}

.linha {
  position: absolute;

  left: 3%;
  right: 3%;

  top: 50%;

  height: 3px;

  background: #ef4444;

  box-shadow:
    0 0 10px #ef4444;
}

.instrucao {
  margin-top: 13px;
  color: #cbd5e1;
  font-size: 14px;
  line-height: 1.4;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  margin-top: 14px;

  color: white;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#btnCamera {
  background: #2563eb;
}

#btnCapturar {
  background: #059669;
}

#btnCapturar:disabled {
  background: #475569;
  opacity: 0.7;
}

#btnLanterna {
  background: #d97706;
}

#btnLanterna:disabled {
  background: #475569;
  opacity: 0.7;
}

.resultado {
  margin-top: 18px;

  padding: 20px;

  background: #1e293b;

  border-radius: 14px;
}

.rotulo {
  color: #94a3b8;
  font-size: 13px;
}

#codigo {
  margin-top: 8px;

  color: #22c55e;

  font-size: 24px;
  font-weight: bold;

  word-break: break-all;
}

#formato {
  margin-top: 8px;

  color: #38bdf8;

  font-size: 14px;
}

#mensagem {
  margin-top: 15px;

  color: #fbbf24;

  line-height: 1.4;

  font-size: 14px;
}

/* Canvas usado para captura */

#canvas {
  display: none;
}

</style>
</head>


<body>

<div class="container">

  <h1>Leitor de Código de Barras</h1>

  <div class="subtitulo">
    Centralize o código dentro da área amarela
  </div>


  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="mira">

      <div class="linha"></div>

    </div>

  </div>


  <div class="instrucao">
    Mantenha todas as barras dentro do retângulo amarelo.
    A leitura automática ficará funcionando continuamente.
  </div>


  <button id="btnCamera">
    ABRIR CÂMERA
  </button>


  <button id="btnCapturar" disabled>
    CAPTURAR E LER
  </button>


  <button id="btnLanterna" disabled>
    LIGAR LANTERNA
  </button>


  <div class="resultado">

    <div class="rotulo">
      CÓDIGO LIDO
    </div>

    <div id="codigo">
      Aguardando...
    </div>

    <div id="formato"></div>

  </div>


  <div id="mensagem">
    Abra a câmera para começar.
  </div>


  <canvas id="canvas"></canvas>

</div>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const codigo =
  document.getElementById("codigo");

const formato =
  document.getElementById("formato");

const mensagem =
  document.getElementById("mensagem");

const btnCamera =
  document.getElementById("btnCamera");

const btnCapturar =
  document.getElementById("btnCapturar");

const btnLanterna =
  document.getElementById("btnLanterna");


let leitor = null;

let streamAtual = null;

let trackVideo = null;

let lanternaLigada = false;

let ultimoCodigo = "";


// ========================================
// CONFIGURAÇÃO DO ZXING
// ========================================

function criarLeitor() {

  const hints = new Map();

  const formatos = [

    ZXing.BarcodeFormat.EAN_13,

    ZXing.BarcodeFormat.CODE_128,

    ZXing.BarcodeFormat.CODE_39,

    ZXing.BarcodeFormat.CODE_93,

    ZXing.BarcodeFormat.ITF,

    ZXing.BarcodeFormat.CODABAR,

    ZXing.BarcodeFormat.EAN_8,

    ZXing.BarcodeFormat.UPC_A,

    ZXing.BarcodeFormat.UPC_E

  ];


  hints.set(
    ZXing.DecodeHintType.POSSIBLE_FORMATS,
    formatos
  );


  hints.set(
    ZXing.DecodeHintType.TRY_HARDER,
    true
  );


  return new ZXing.BrowserMultiFormatReader(hints);

}


// ========================================
// MOSTRAR RESULTADO
// ========================================

function mostrarResultado(resultado) {

  if (!resultado) {
    return;
  }


  const texto =
    resultado.getText();


  if (!texto) {
    return;
  }


  codigo.innerText =
    texto;


  try {

    formato.innerText =
      "Formato: " +
      resultado.getBarcodeFormat();

  } catch (e) {

    formato.innerText =
      "Código identificado";

  }


  mensagem.innerText =
    "Código identificado com sucesso!";


  if (texto !== ultimoCodigo) {

    ultimoCodigo = texto;


    if (navigator.vibrate) {

      navigator.vibrate([
        100,
        50,
        100
      ]);

    }

  }

}


// ========================================
// ABRIR CÂMERA
// ========================================

btnCamera.addEventListener(
  "click",
  abrirCamera
);


async function abrirCamera() {

  btnCamera.disabled = true;

  btnCamera.innerText =
    "ABRINDO CÂMERA...";


  codigo.innerText =
    "Procurando código...";


  formato.innerText = "";


  mensagem.innerText =
    "Solicitando acesso à câmera traseira...";


  try {

    leitor = criarLeitor();


    const constraints = {

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        },

        focusMode: {
          ideal: "continuous"
        }

      },

      audio: false

    };


    await leitor.decodeFromConstraints(

      constraints,

      video,

      function(resultado, erro) {

        if (resultado) {

          mostrarResultado(resultado);

        }

      }

    );


    // Pegar stream que o ZXing colocou no vídeo

    streamAtual =
      video.srcObject;


    if (streamAtual) {

      const tracks =
        streamAtual.getVideoTracks();


      if (tracks.length > 0) {

        trackVideo =
          tracks[0];

      }

    }


    btnCamera.innerText =
      "CÂMERA ATIVA";


    btnCapturar.disabled =
      false;


    mensagem.innerText =
      "Câmera ativa. Procurando código automaticamente...";


    verificarLanterna();


  } catch (erro) {

    console.error(erro);


    btnCamera.disabled =
      false;


    btnCamera.innerText =
      "TENTAR NOVAMENTE";


    codigo.innerText =
      "Câmera não iniciada";


    mensagem.innerText =
      "Erro: " + erro.message;

  }

}


// ========================================
// VERIFICAR LANTERNA
// ========================================

function verificarLanterna() {

  if (!trackVideo) {
    return;
  }


  try {

    const capacidades =
      trackVideo.getCapabilities();


    if (capacidades.torch) {

      btnLanterna.disabled =
        false;

    }

  } catch (erro) {

    console.log(
      "Lanterna não disponível."
    );

  }

}


// ========================================
// LANTERNA
// ========================================

btnLanterna.addEventListener(
  "click",
  async function() {

    if (!trackVideo) {
      return;
    }


    try {

      lanternaLigada =
        !lanternaLigada;


      await trackVideo.applyConstraints({

        advanced: [

          {
            torch: lanternaLigada
          }

        ]

      });


      btnLanterna.innerText =
        lanternaLigada
        ? "DESLIGAR LANTERNA"
        : "LIGAR LANTERNA";


    } catch (erro) {

      mensagem.innerText =
        "Este aparelho não permitiu controlar a lanterna.";

    }

  }
);


// ========================================
// CAPTURAR IMAGEM E TENTAR LER
// ========================================

btnCapturar.addEventListener(
  "click",
  capturarELer
);


async function capturarELer() {

  if (!video.videoWidth) {

    mensagem.innerText =
      "A câmera ainda não está pronta.";

    return;

  }


  mensagem.innerText =
    "Capturando imagem...";


  const largura =
    video.videoWidth;

  const altura =
    video.videoHeight;


  canvas.width =
    largura;

  canvas.height =
    altura;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.drawImage(
    video,
    0,
    0,
    largura,
    altura
  );


  try {

    /*
      Primeiro tentamos ler
      a imagem completa.
    */

    const resultado =
      await leitor.decodeFromCanvas(
        canvas
      );


    mostrarResultado(
      resultado
    );


  } catch (erro) {


    /*
      Segunda tentativa:
      recortamos a região central,
      onde está a mira amarela.
    */


    tentarRegiaoCentral(
      ctx,
      largura,
      altura
    );

  }

}


// ========================================
// TENTAR SOMENTE A REGIÃO CENTRAL
// ========================================

async function tentarRegiaoCentral(
  ctx,
  largura,
  altura
) {

  try {

    const recorteLargura =
      Math.floor(
        largura * 0.95
      );


    const recorteAltura =
      Math.floor(
        altura * 0.42
      );


    const inicioX =
      Math.floor(
        (largura - recorteLargura) / 2
      );


    const inicioY =
      Math.floor(
        (altura - recorteAltura) / 2
      );


    const dados =
      ctx.getImageData(

        inicioX,

        inicioY,

        recorteLargura,

        recorteAltura

      );


    const canvasRecorte =
      document.createElement(
        "canvas"
      );


    canvasRecorte.width =
      recorteLargura;


    canvasRecorte.height =
      recorteAltura;


    const contextoRecorte =
      canvasRecorte.getContext(
        "2d"
      );


    contextoRecorte.putImageData(
      dados,
      0,
      0
    );


    const resultado =
      await leitor.decodeFromCanvas(
        canvasRecorte
      );


    mostrarResultado(
      resultado
    );


  } catch (erro) {

    console.log(erro);


    codigo.innerText =
      "Não identificado";


    formato.innerText = "";


    mensagem.innerText =
      "Não consegui ler esta captura. " +
      "Aproxime o código até as barras ficarem nítidas e tente novamente.";

  }

}

</script>

</body>
</html>
