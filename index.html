<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Leitor de Código de Barras</title>

  <!-- Versão fixa do ZXing -->
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin: 15px 0 5px;
    }

    .status {
      color: #cbd5e1;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      min-height: 300px;
      overflow: hidden;
      border-radius: 15px;
      background: black;
      border: 2px solid #374151;
    }

    video {
      width: 100%;
      min-height: 300px;
      display: block;
      object-fit: cover;
    }

    .linha {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 3px;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      pointer-events: none;
    }

    .instrucao {
      margin-top: 15px;
      color: #cbd5e1;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .resultado {
      margin-top: 20px;
      padding: 22px;
      background: #1f2937;
      border-radius: 12px;
    }

    .resultado small {
      color: #9ca3af;
    }

    #codigo {
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
      color: #22c55e;
    }

    #mensagem {
      margin-top: 18px;
      padding-bottom: 20px;
      font-size: 15px;
      line-height: 1.4;
      color: #fbbf24;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Leitor de Código de Barras</h1>

  <div class="status">
    Aponte a câmera para o código do chassi
  </div>

  <div class="camera-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="linha"></div>

  </div>

  <div class="instrucao">
    Posicione o código de barras atravessando a linha vermelha.
  </div>

  <button id="btnCamera">
    ABRIR CÂMERA
  </button>

  <div class="resultado">

    <small>CÓDIGO LIDO</small>

    <div id="codigo">
      Aguardando leitura...
    </div>

  </div>

  <div id="mensagem">
    Toque em ABRIR CÂMERA para começar.
  </div>

</div>


<script>

const video = document.getElementById("video");
const codigo = document.getElementById("codigo");
const mensagem = document.getElementById("mensagem");
const btnCamera = document.getElementById("btnCamera");

let leitor = null;
let cameraAtiva = false;
let ultimoCodigo = "";


// ------------------------------------------
// BOTÃO
// ------------------------------------------

btnCamera.addEventListener("click", iniciarLeitor);


// ------------------------------------------
// INICIAR LEITOR
// ------------------------------------------

async function iniciarLeitor() {

  if (cameraAtiva) {
    return;
  }

  btnCamera.disabled = true;
  btnCamera.innerText = "ABRINDO CÂMERA...";

  codigo.innerText = "Procurando código...";

  mensagem.innerText =
    "Permita o acesso à câmera quando o navegador solicitar.";

  try {

    // --------------------------------------
    // CONFIGURAÇÃO DOS CÓDIGOS
    // --------------------------------------

    const hints = new Map();

    const formatos = [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E
    ];

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      formatos
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );


    // --------------------------------------
    // CRIAR LEITOR
    // --------------------------------------

    leitor =
      new ZXing.BrowserMultiFormatReader(hints);


    // --------------------------------------
    // PEDIR CÂMERA TRASEIRA
    // --------------------------------------

    const constraints = {

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    // --------------------------------------
    // INICIAR LEITURA
    // --------------------------------------

    await leitor.decodeFromConstraints(

      constraints,

      video,

      (resultado, erro) => {

        if (resultado) {

          const texto = resultado.getText();

          if (texto && texto !== ultimoCodigo) {

            ultimoCodigo = texto;

            codigo.innerText = texto;

            mensagem.innerText =
              "Código identificado com sucesso!";

            if (navigator.vibrate) {
              navigator.vibrate(200);
            }

          }

        }

        if (erro) {

          // NotFoundException é normal.
          // Significa apenas que naquele quadro
          // ainda não encontrou código.

          if (!(erro instanceof ZXing.NotFoundException)) {
            console.log(erro);
          }

        }

      }

    );


    cameraAtiva = true;

    btnCamera.innerText = "CÂMERA ATIVA";

    mensagem.innerText =
      "Câmera aberta. Procurando código de barras...";


  } catch (erro) {

    console.error(erro);

    cameraAtiva = false;

    btnCamera.disabled = false;

    btnCamera.innerText =
      "TENTAR NOVAMENTE";

    codigo.innerText =
      "Câmera não iniciada";

    mensagem.innerText =
      "Erro: " + erro.message;

  }

}

</script>

</body>
</html>
