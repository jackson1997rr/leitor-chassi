<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Leitor de Código de Barras</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 18px;
  text-align: center;
}

h1 {
  font-size: 24px;
  margin: 10px 0 5px;
}

.subtitulo {
  color: #cbd5e1;
  margin-bottom: 15px;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 390px;
  overflow: hidden;
  border-radius: 16px;
  background: black;
  border: 2px solid #334155;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mira {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  height: 150px;

  border: 3px solid #f59e0b;
  border-radius: 10px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,0.25);

  pointer-events: none;
}

.linha {
  position: absolute;
  left: 3%;
  right: 3%;
  top: 50%;
  height: 3px;

  background: #ef4444;
  box-shadow: 0 0 12px #ef4444;
}

.painel-camera {
  margin-top: 15px;
  padding: 15px;

  background: #1e293b;

  border-radius: 12px;

  text-align: left;
}

.painel-camera label {
  display: block;
  margin-bottom: 7px;

  color: #94a3b8;

  font-size: 13px;
}

select {
  width: 100%;

  padding: 13px;

  border: 1px solid #475569;
  border-radius: 9px;

  background: #0f172a;
  color: white;

  font-size: 16px;
}

.info-camera {
  margin-top: 10px;

  color: #38bdf8;

  font-size: 13px;

  line-height: 1.5;
}

.zoom-box {
  display: none;

  margin-top: 14px;
}

.zoom-linha {
  display: flex;
  align-items: center;
  gap: 10px;
}

#zoom {
  flex: 1;
}

#zoomValor {
  min-width: 45px;
  color: #22c55e;
  font-weight: bold;
}

.instrucao {
  color: #cbd5e1;

  margin: 15px 0;

  font-size: 14px;

  line-height: 1.4;
}

button {
  width: 100%;

  padding: 16px;

  margin-top: 12px;

  border: 0;
  border-radius: 12px;

  color: white;

  font-size: 17px;
  font-weight: bold;
}

#btnCamera {
  background: #2563eb;
}

#btnCapturar {
  background: #059669;
}

#btnCapturar:disabled {
  background: #475569;
}

.resultado {
  margin-top: 18px;

  padding: 20px;

  background: #1e293b;

  border-radius: 14px;
}

.label {
  color: #94a3b8;

  font-size: 13px;
}

#codigo {
  margin-top: 8px;

  color: #22c55e;

  font-size: 24px;
  font-weight: bold;

  word-break: break-all;
}

#formato {
  margin-top: 8px;

  color: #38bdf8;
}

#mensagem {
  margin-top: 15px;

  padding-bottom: 20px;

  color: #fbbf24;

  font-size: 14px;

  line-height: 1.4;
}

#motor {
  margin-top: 6px;

  color: #94a3b8;

  font-size: 12px;
}

canvas {
  display: none;
}

/* ===== CADASTRO DO VEÍCULO ===== */
.cadastro {
  margin-top: 18px;
  padding: 18px;
  background: #1e293b;
  border-radius: 14px;
  text-align: left;
}
.cadastro h2 {
  margin: 0 0 6px;
  text-align: center;
  font-size: 20px;
}
.cadastro .ajuda {
  margin: 0 0 14px;
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
}
.campo {
  margin-top: 12px;
}
.campo label {
  display: block;
  margin-bottom: 7px;
  color: #94a3b8;
  font-size: 13px;
  font-weight: bold;
}
.campo input,
.campo select {
  width: 100%;
  padding: 13px;
  border: 1px solid #475569;
  border-radius: 9px;
  background: #0f172a;
  color: white;
  font-size: 16px;
}
.campo input[readonly] {
  color: #22c55e;
  font-weight: bold;
}
.marca-botoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.marca-btn {
  margin-top: 0;
  background: #334155;
}
.marca-btn.ativo {
  background: #2563eb;
  outline: 2px solid #60a5fa;
}
#btnSalvar {
  background: #16a34a;
}
#btnSalvar:disabled {
  background: #475569;
}
#btnNovo {
  background: #475569;
}
#statusCadastro {
  margin-top: 14px;
  min-height: 20px;
  text-align: center;
  font-size: 14px;
  line-height: 1.4;
}
.status-ok { color: #4ade80; }
.status-erro { color: #f87171; }
.status-info { color: #fbbf24; }

</style>
</head>


<body>

<div class="container">

<h1>Leitor de Código de Barras</h1>

<div class="subtitulo">
  Selecione a melhor câmera traseira
</div>


<div class="camera-box">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div class="mira">

    <div class="linha"></div>

  </div>

</div>


<div class="painel-camera">

  <label>
    CÂMERA
  </label>

  <select id="cameraSelect">

    <option value="">
      Abra a câmera primeiro
    </option>

  </select>


  <div
    class="info-camera"
    id="infoCamera">
  </div>


  <div
    class="zoom-box"
    id="zoomBox">

    <label>
      ZOOM
    </label>

    <div class="zoom-linha">

      <input
        type="range"
        id="zoom">

      <span id="zoomValor">
        1x
      </span>

    </div>

  </div>

</div>


<div class="instrucao">

  Centralize todas as barras dentro
  do retângulo amarelo.

</div>


<button id="btnCamera">
  ABRIR CÂMERA
</button>


<button
  id="btnCapturar"
  disabled>

  CAPTURAR E LER

</button>


<div class="resultado">

  <div class="label">
    CÓDIGO LIDO
  </div>

  <div id="codigo">
    Aguardando...
  </div>

  <div id="formato"></div>

  <div id="motor"></div>

</div>


<div id="mensagem">

  Abra a câmera para começar.

</div>



<div class="cadastro" id="cadastro">
  <h2>Cadastro do veículo</h2>
  <div class="ajuda">Após a leitura do código, complete os dados abaixo.</div>

  <div class="campo">
    <label>CHASSIS / CÓDIGO LIDO</label>
    <input id="chassiCadastro" type="text" readonly placeholder="Aguardando leitura...">
  </div>

  <div class="campo">
    <label>MARCA</label>
    <div class="marca-botoes">
      <button type="button" class="marca-btn" data-marca="FIAT">FIAT</button>
      <button type="button" class="marca-btn" data-marca="JEEP">JEEP</button>
    </div>
  </div>

  <div class="campo">
    <label>MODELO</label>
    <select id="modeloCadastro" disabled>
      <option value="">Selecione a marca primeiro</option>
    </select>
  </div>

  <div class="campo">
    <label>VERSÃO</label>
    <select id="versaoCadastro" disabled>
      <option value="">Selecione o modelo primeiro</option>
    </select>
  </div>

  <div class="campo">
    <label>COR</label>
    <select id="corCadastro" disabled>
      <option value="">Selecione o modelo primeiro</option>
    </select>
  </div>

  <div class="campo">
    <label>LOCALIZAÇÃO</label>
    <select id="localizacaoCadastro">
      <option value="">Selecione o pátio</option>
      <option>Pátio Caminhões</option>
      <option>Pátio 1</option>
      <option>Pátio 2</option>
      <option>Pátio Santa Genoveva</option>
    </select>
  </div>

  <button type="button" id="btnSalvar">SALVAR NA PLANILHA</button>
  <button type="button" id="btnNovo">NOVO VEÍCULO</button>
  <div id="statusCadastro" class="status-info"></div>
</div>


<canvas id="canvas"></canvas>

</div>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const btnCamera =
  document.getElementById("btnCamera");

const btnCapturar =
  document.getElementById("btnCapturar");

const cameraSelect =
  document.getElementById("cameraSelect");

const infoCamera =
  document.getElementById("infoCamera");

const zoomBox =
  document.getElementById("zoomBox");

const zoom =
  document.getElementById("zoom");

const zoomValor =
  document.getElementById("zoomValor");

const codigo =
  document.getElementById("codigo");

const formato =
  document.getElementById("formato");

const mensagem =
  document.getElementById("mensagem");

const motor =
  document.getElementById("motor");


let detector = null;

let stream = null;

let track = null;

let intervalo = null;

let processando = false;

let ultimoCodigo = "";


// =====================================
// CADASTRO / GOOGLE SHEETS
// =====================================
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7gLj67JSX1_I0bhOkEzCJKyJlgJei66XEICrQJKd82LrnRx7iXAcXfpoTf7-egYwNSg/exec";

const chassiCadastro = document.getElementById("chassiCadastro");
const modeloCadastro = document.getElementById("modeloCadastro");
const versaoCadastro = document.getElementById("versaoCadastro");
const corCadastro = document.getElementById("corCadastro");
const localizacaoCadastro = document.getElementById("localizacaoCadastro");
const btnSalvar = document.getElementById("btnSalvar");
const btnNovo = document.getElementById("btnNovo");
const statusCadastro = document.getElementById("statusCadastro");
const marcaBotoes = Array.from(document.querySelectorAll(".marca-btn"));

let marcaSelecionada = "";

const catalogo = {
  FIAT: {
    "MOBI": {

      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE"]
    },
    "ARGO": {
      versoes: ["DRIVE 1.0 MT", "DRIVE 1.3 AT", "TREKKING 1.3 MT", "TREKKING 1.3 AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "PRATA BARI"]
    },
    "CRONOS": {
      versoes: ["DRIVE 1.0", "DRIVE 1.3", "DRIVE 1.3 AT", "PRECISION 1.3 AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "CINZA SILVERSTONE", "PRATA BARI"]
    },
    "PULSE": {
      versoes: ["DRIVE 1.3 MT", "DRIVE 1.3 AT", "AUDACE T200 MHEV AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "CINZA STRATO"]
    },
    "FASTBACK": {
      versoes: ["TURBO 200 AT", "SMART DRIVE TURBO 200 AT", "AUDACE TURBO 200 MHEV AT", "IMPETUS TURBO 200 MHEV AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "CINZA STRATO"]
    },
    "STRADA": {
      versoes: ["ENDURANCE CABINE PLUS", "FREEDOM CABINE PLUS", "FREEDOM CABINE DUPLA", "VOLCANO CABINE DUPLA", "VOLCANO CABINE DUPLA AT", "ULTRA CABINE DUPLA", "RANCH CABINE DUPLA"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "PRATA BARI"]
    },
    "TORO": {
      versoes: ["ENDURANCE T270", "FREEDOM T270", "VOLCANO T270 MHEV", "ULTRA T270 MHEV", "VOLCANO TURBODIESEL 4X4", "RANCH TURBODIESEL 4X4"],
      cores: ["BRANCO AMBIENTE", "PRETO CARBON", "VERMELHO COLORADO", "GRANITE CRYSTAL", "PRATA BILLET"]
    },
    "TITANO": {
      versoes: ["ENDURANCE", "VOLCANO", "RANCH"],

    },

      cores: ["BRANCO BANCHISA", "PRATA"]
    },
    "DUCATO": {
      versoes: ["CARGO", "MAXICARGO", "MULTI"],
      cores: ["BRANCO"]
    },
    "500E": {
      versoes: ["ICON"],
      cores: ["BRANCO", "PRETO", "CINZA"]
    }
  },
  JEEP: {

      versoes: ["ALTITUDE T200 MHEV", "LONGITUDE T200 MHEV", "LIMITED T200 MHEV"],
      cores: ["PRETO CARBON", "BRANCO SNOW", "VERMELHO SUNSET", "CINZA GRANITE", "CINZA CONCRETE"]
    },
    "RENEGADE": {
      versoes: ["ALTITUDE T270 4X2", "LONGITUDE T270 MHEV 4X2", "SAHARA T270 MHEV 4X2", "WILLYS T270 4X4"],
      cores: ["BRANCO POLAR", "PRETO CARBON", "CINZA GRANITE", "STING GRAY BICOLOR", "AZUL JAZZ", "VERDE RECON COM TETO PRETO"]
    },
    "COMPASS": {
      versoes: ["SPORT T270", "LONGITUDE T270", "SÉRIE S T270", "BLACKHAWK HURRICANE"],
      cores: ["BRANCO POLAR", "PRETO CARBON", "CINZA GRANITE", "PRATA BILLET", "AZUL JAZZ", "VERMELHO SUNSET"]
    },
    "COMMANDER": {
      versoes: ["LONGITUDE T270", "LIMITED T270 MHEV", "OVERLAND T270 MHEV", "OVERLAND 2.2 TURBODIESEL 4X4", "BLACKHAWK HURRICANE 4X4"],
      cores: ["BRANCO POLAR", "PRETO CARBON", "CINZA GRANITE", "PRATA BILLET", "AZUL JAZZ"]
    },
    "WRANGLER": {
      versoes: ["SAHARA", "RUBICON"],
      cores: ["BRANCO", "PRETO", "CINZA", "VERMELHO"]
    },
    "GLADIATOR": {
      versoes: ["RUBICON"],

function preencherSelect(select, itens, placeholder) {
  select.innerHTML = "";
  const inicial = document.createElement("option");
  inicial.value = "";
  inicial.textContent = placeholder;
  select.appendChild(inicial);

  itens.forEach(item => {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    select.appendChild(option);
  });

  select.disabled = itens.length === 0;
}

marcaBotoes.forEach(botao => {
  botao.addEventListener("click", function() {
    marcaSelecionada = this.dataset.marca;

    marcaBotoes.forEach(b => b.classList.remove("ativo"));
    this.classList.add("ativo");

    const modelos = Object.keys(catalogo[marcaSelecionada] || {});
    preencherSelect(modeloCadastro, modelos, "Selecione o modelo");
    preencherSelect(versaoCadastro, [], "Selecione o modelo primeiro");
    preencherSelect(corCadastro, [], "Selecione o modelo primeiro");
    statusCadastro.textContent = "";
  });
});

modeloCadastro.addEventListener("change", function() {
  const dadosModelo = catalogo[marcaSelecionada]?.[this.value];

  if (!dadosModelo) {
    preencherSelect(versaoCadastro, [], "Selecione o modelo primeiro");
    preencherSelect(corCadastro, [], "Selecione o modelo primeiro");
    return;
  }

  preencherSelect(versaoCadastro, dadosModelo.versoes, "Selecione a versão");
  preencherSelect(corCadastro, dadosModelo.cores, "Selecione a cor");
});

function prepararNovoCadastro() {
  chassiCadastro.value = "";
  marcaSelecionada = "";
  marcaBotoes.forEach(b => b.classList.remove("ativo"));
  preencherSelect(modeloCadastro, [], "Selecione a marca primeiro");
  preencherSelect(versaoCadastro, [], "Selecione o modelo primeiro");
  preencherSelect(corCadastro, [], "Selecione o modelo primeiro");
  localizacaoCadastro.value = "";
  statusCadastro.textContent = "";
  statusCadastro.className = "status-info";
  ultimoCodigo = "";
  codigo.innerText = "Procurando código...";
  formato.innerText = "";
}

btnNovo.addEventListener("click", prepararNovoCadastro);

btnSalvar.addEventListener("click", async function() {
  const dados = {
    marca: marcaSelecionada,
    chassi: chassiCadastro.value.trim(),
    modelo: modeloCadastro.value,
    versao: versaoCadastro.value,
    cor: corCadastro.value,
    localizacao: localizacaoCadastro.value
  };

  if (!dados.chassi || !dados.marca || !dados.modelo || !dados.versao || !dados.cor || !dados.localizacao) {
    statusCadastro.textContent = "Complete todos os campos antes de salvar.";
    statusCadastro.className = "status-erro";
    return;
  }

  btnSalvar.disabled = true;
  btnSalvar.textContent = "SALVANDO...";
  statusCadastro.textContent = "Enviando dados para a planilha...";
  statusCadastro.className = "status-info";

  try {
    // text/plain evita preflight CORS no Apps Script.
    const resposta = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(dados),
      redirect: "follow"
    });

    const texto = await resposta.text();
    let resultado;

    try {
      resultado = JSON.parse(texto);
    } catch (_) {
      throw new Error("O Apps Script não retornou uma resposta JSON válida.");
    }

    if (!resultado.sucesso) {
      throw new Error(resultado.mensagem || "Não foi possível cadastrar o veículo.");
    }

    statusCadastro.textContent = resultado.mensagem || "Veículo cadastrado com sucesso!";
    statusCadastro.className = "status-ok";

    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

    setTimeout(prepararNovoCadastro, 1800);

  } catch (erro) {
    console.error(erro);
    statusCadastro.textContent = "Erro ao salvar: " + erro.message;
    statusCadastro.className = "status-erro";
  } finally {
    btnSalvar.disabled = false;
    btnSalvar.textContent = "SALVAR NA PLANILHA";
  }
});



// =====================================
// BARCODE DETECTOR
// =====================================

async function prepararDetector() {

  if (!("BarcodeDetector" in window)) {

    throw new Error(
      "BarcodeDetector não disponível."
    );

  }


  const suportados =
    await BarcodeDetector.getSupportedFormats();


  const desejados = [

    "ean_13",
    "ean_8",
    "code_128",
    "code_39",
    "code_93",
    "codabar",
    "itf",
    "upc_a",
    "upc_e"

  ];


  const formatosValidos =
    desejados.filter(
      f => suportados.includes(f)
    );


  detector =
    new BarcodeDetector({

      formats: formatosValidos

    });


  motor.innerText =
    "Motor: leitor nativo do navegador";

}


// =====================================
// PARAR CÂMERA
// =====================================

function pararCamera() {

  if (intervalo) {

    clearInterval(intervalo);

    intervalo = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        t => t.stop()
      );

  }


  stream = null;
  track = null;

}


// =====================================
// PRIMEIRA ABERTURA
// =====================================

btnCamera.addEventListener(
  "click",
  iniciar
);


async function iniciar() {

  btnCamera.disabled = true;

  btnCamera.innerText =
    "ABRINDO CÂMERA...";


  mensagem.innerText =
    "Solicitando acesso à câmera...";


  try {

    await prepararDetector();


    /*
      Primeiro abrimos qualquer câmera traseira.
      Isso libera os nomes das câmeras para o navegador.
    */

    const temporaria =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      });


    temporaria
      .getTracks()
      .forEach(
        t => t.stop()
      );


    await carregarListaCameras();


    const cameraSalva =
      localStorage.getItem(
        "cameraPreferida"
      );


    let cameraInicial = "";


    if (
      cameraSalva &&
      Array.from(
        cameraSelect.options
      ).some(
        option =>
          option.value === cameraSalva
      )
    ) {

      cameraInicial =
        cameraSalva;

    } else {

      /*
        Começamos pela primeira câmera
        traseira encontrada.
      */

      const primeira =
        Array.from(
          cameraSelect.options
        ).find(
          option =>
            option.value
        );


      if (primeira) {

        cameraInicial =
          primeira.value;

      }

    }


    if (!cameraInicial) {

      throw new Error(
        "Nenhuma câmera encontrada."
      );

    }


    cameraSelect.value =
      cameraInicial;


    await abrirCamera(
      cameraInicial
    );


    btnCamera.innerText =
      "CÂMERA ATIVA";


    btnCapturar.disabled =
      false;


  } catch (erro) {

    console.error(erro);


    btnCamera.disabled =
      false;


    btnCamera.innerText =
      "TENTAR NOVAMENTE";


    mensagem.innerText =
      "Erro: " + erro.message;

  }

}


// =====================================
// LISTAR CÂMERAS
// =====================================

async function carregarListaCameras() {

  const dispositivos =
    await navigator.mediaDevices
      .enumerateDevices();


  const cameras =
    dispositivos.filter(
      d => d.kind === "videoinput"
    );


  cameraSelect.innerHTML = "";


  cameras.forEach(
    (camera, indice) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        camera.deviceId;


      option.textContent =
        camera.label ||
        "Câmera " + (indice + 1);


      cameraSelect.appendChild(
        option
      );

    }
  );


  if (cameras.length === 0) {

    cameraSelect.innerHTML =
      "<option>Nenhuma câmera encontrada</option>";

  }

}


// =====================================
// TROCAR CÂMERA
// =====================================

cameraSelect.addEventListener(
  "change",
  async function() {

    const deviceId =
      cameraSelect.value;


    if (!deviceId) {
      return;
    }


    mensagem.innerText =
      "Trocando câmera...";


    localStorage.setItem(
      "cameraPreferida",
      deviceId
    );


    await abrirCamera(
      deviceId
    );

  }
);


// =====================================
// ABRIR CÂMERA ESPECÍFICA
// =====================================

async function abrirCamera(
  deviceId
) {

  pararCamera();


  codigo.innerText =
    "Procurando código...";


  formato.innerText = "";


  zoomBox.style.display =
    "none";


  stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio: false,

        video: {

          deviceId: {
            exact: deviceId
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });


  video.srcObject =
    stream;


  await video.play();


  track =
    stream.getVideoTracks()[0];


  configurarCamera();


  mensagem.innerText =
    "Câmera ativa. Procurando código...";


  iniciarLeitura();

}


// =====================================
// RECURSOS DA CÂMERA
// =====================================

async function configurarCamera() {

  if (!track) {
    return;
  }


  const settings =
    track.getSettings();


  let texto =
    "Ativa: " +
    (track.label || "Câmera");


  if (
    settings.width &&
    settings.height
  ) {

    texto +=
      "<br>Resolução: " +
      settings.width +
      " × " +
      settings.height;

  }


  infoCamera.innerHTML =
    texto;


  let capacidades = {};


  try {

    capacidades =
      track.getCapabilities();

  } catch (erro) {

    console.log(erro);

  }


  /*
    Tentar foco contínuo
  */

  try {

    if (
      capacidades.focusMode &&
      capacidades.focusMode.includes(
        "continuous"
      )
    ) {

      await track.applyConstraints({

        advanced: [

          {
            focusMode: "continuous"
          }

        ]

      });

    }

  } catch (erro) {

    console.log(
      "Foco contínuo não disponível."
    );

  }


  /*
    Configurar zoom
  */

  if (capacidades.zoom) {

    zoom.min =
      capacidades.zoom.min;

    zoom.max =
      capacidades.zoom.max;

    zoom.step =
      capacidades.zoom.step || 0.1;


    const zoomAtual =
      settings.zoom ||
      capacidades.zoom.min;


    zoom.value =
      zoomAtual;


    zoomValor.innerText =
      Number(
        zoomAtual
      ).toFixed(1) + "x";


    zoomBox.style.display =
      "block";

  }

}


// =====================================
// ZOOM
// =====================================

zoom.addEventListener(
  "input",
  async function() {

    if (!track) {
      return;
    }


    const valor =
      Number(
        zoom.value
      );


    zoomValor.innerText =
      valor.toFixed(1) + "x";


    try {

      await track.applyConstraints({

        advanced: [

          {
            zoom: valor
          }

        ]

      });

    } catch (erro) {

      console.log(
        "Erro no zoom:",
        erro
      );

    }

  }
);


// =====================================
// LEITURA AUTOMÁTICA
// =====================================

function iniciarLeitura() {

  if (intervalo) {

    clearInterval(
      intervalo
    );

  }


  intervalo =
    setInterval(

      async function() {

        if (
          processando ||
          !detector ||
          video.readyState < 2
        ) {

          return;

        }


        processando = true;


        try {

          const resultados =
            await detector.detect(
              video
            );


          if (
            resultados &&
            resultados.length > 0
          ) {

            mostrarResultado(
              resultados[0]
            );

          }

        } catch (erro) {

          console.log(erro);

        }


        processando = false;

      },

      200

    );

}


// =====================================
// RESULTADO
// =====================================

function mostrarResultado(
  item
) {

  if (
    !item ||
    !item.rawValue
  ) {

    return;

  }


  const valor =
    item.rawValue;


  codigo.innerText =
    valor;

  // Envia automaticamente o código lido para o formulário de cadastro.
  if (chassiCadastro) {
    chassiCadastro.value = String(valor).trim().toUpperCase();
  }


  formato.innerText =
    "Formato: " +
    (item.format || "identificado");


  mensagem.innerText =
    "Código identificado com sucesso!";


  if (
    valor !== ultimoCodigo
  ) {

    ultimoCodigo =
      valor;


    if (
      navigator.vibrate
    ) {

      navigator.vibrate([
        100,
        50,
        100
      ]);

    }

  }

}


// =====================================
// CAPTURAR E LER
// =====================================

btnCapturar.addEventListener(
  "click",
  capturar
);


async function capturar() {

  if (
    !detector ||
    !video.videoWidth
  ) {

    return;

  }


  mensagem.innerText =
    "Capturando e analisando...";


  const largura =
    video.videoWidth;

  const altura =
    video.videoHeight;


  canvas.width =
    largura;

  canvas.height =
    altura;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    video,
    0,
    0,
    largura,
    altura
  );


  try {

    const resultados =
      await detector.detect(
        canvas
      );


    if (
      resultados &&
      resultados.length > 0
    ) {

      mostrarResultado(
        resultados[0]
      );

    } else {

      codigo.innerText =
        "Não identificado";


      formato.innerText = "";


      mensagem.innerText =
        "Nenhum código identificado nesta captura.";

    }


  } catch (erro) {

    mensagem.innerText =
      "Erro: " + erro.message;

  }

}

</script>
