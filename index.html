<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Leitor de Código de Barras</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 18px;
  text-align: center;
}

h1 {
  font-size: 24px;
  margin: 10px 0 5px;
}

.subtitulo {
  color: #cbd5e1;
  margin-bottom: 15px;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 180px;
  overflow: hidden;
  border-radius: 16px;
  background: black;
  border: 2px solid #334155;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mira {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  transform: translateY(-50%);
  height: 90px;

  border: 3px solid #f59e0b;
  border-radius: 10px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,0.25);

  pointer-events: none;
}

.linha {
  position: absolute;
  left: 3%;
  right: 3%;
  top: 50%;
  height: 3px;

  background: #ef4444;
  box-shadow: 0 0 12px #ef4444;
}

.painel-camera {
  margin-top: 8px;
  padding: 8px 10px;

  background: #1e293b;

  border-radius: 12px;

  text-align: left;
}

.painel-camera label {
  display: block;
  margin-bottom: 7px;

  color: #94a3b8;

  font-size: 13px;
}

select {
  width: 100%;

  padding: 13px;

  border: 1px solid #475569;
  border-radius: 9px;

  background: #0f172a;
  color: white;

  font-size: 16px;
}

.info-camera {
  margin-top: 10px;

  color: #38bdf8;

  font-size: 13px;

  line-height: 1.5;
}

.zoom-box {
  display: none;

  margin-top: 14px;
}

.zoom-linha {
  display: flex;
  align-items: center;
  gap: 10px;
}

#zoom {
  flex: 1;
}

#zoomValor {
  min-width: 45px;
  color: #22c55e;
  font-weight: bold;
}

.instrucao {
  color: #cbd5e1;

  margin: 7px 0;

  font-size: 12px;

  line-height: 1.4;
}

button {
  width: 100%;

  padding: 16px;

  margin-top: 12px;

  border: 0;
  border-radius: 12px;

  color: white;

  font-size: 17px;
  font-weight: bold;
}

#btnCamera {
  background: #2563eb;
}

#btnCapturar {
  background: #059669;
}

#btnCapturar:disabled {
  background: #475569;
}

.resultado {
  margin-top: 8px;

  padding: 10px;

  background: #1e293b;

  border-radius: 14px;
}

.label {
  color: #94a3b8;

  font-size: 13px;
}

#codigo {
  margin-top: 4px;

  color: #22c55e;

  font-size: 20px;
  font-weight: bold;

  word-break: break-all;
}

#formato {
  margin-top: 8px;

  color: #38bdf8;
}

#mensagem {
  margin-top: 8px;

  padding-bottom: 8px;

  color: #fbbf24;

  font-size: 14px;

  line-height: 1.4;
}

#motor {
  margin-top: 6px;

  color: #94a3b8;

  font-size: 12px;
}

canvas {
  display: none;
}

/* ===== CADASTRO DO VEÍCULO ===== */
.cadastro {
  margin-top: 18px;
  padding: 18px;
  background: #1e293b;
  border-radius: 14px;
  text-align: left;
}
.cadastro h2 {
  margin: 0 0 6px;
  text-align: center;
  font-size: 20px;
}
.cadastro .ajuda {
  margin: 0 0 14px;
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
}
.campo {
  margin-top: 12px;
}
.campo label {
  display: block;
  margin-bottom: 7px;
  color: #94a3b8;
  font-size: 13px;
  font-weight: bold;
}
.campo input,
.campo select {
  width: 100%;
  padding: 13px;
  border: 1px solid #475569;
  border-radius: 9px;
  background: #0f172a;
  color: white;
  font-size: 16px;
}
.campo input[readonly] {
  color: #22c55e;
  font-weight: bold;
}
.marca-botoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.marca-btn {
  margin-top: 0;
  background: #334155;
}
.marca-btn.ativo {
  background: #2563eb;
  outline: 2px solid #60a5fa;
}
#btnDigitarManual {
  background: #d97706;
  margin-top: 8px;
}
#btnSalvar {
  background: #16a34a;
}
#btnSalvar:disabled {
  background: #475569;
}
#btnNovo {
  background: #475569;
}
#statusCadastro {
  margin-top: 14px;
  min-height: 20px;
  text-align: center;
  font-size: 14px;
  line-height: 1.4;
}
.status-ok { color: #4ade80; }
.status-erro { color: #f87171; }
.status-info { color: #fbbf24; }

/* Layout compacto para leitura no celular */
.container { padding: 10px 12px; }
h1 { font-size: 19px; margin: 6px 0 3px; }
.subtitulo { font-size: 12px; margin-bottom: 9px; }
.camera-box { border-radius: 12px; height: 180px !important; position: relative; }
.abrir-no-visor {
  position: absolute; z-index: 5; left: 50%; top: 50%;
  transform: translate(-50%, -50%); width: auto;
  min-width: 160px; margin: 0; padding: 12px 16px;
  background: #2563eb; font-size: 14px;
  box-shadow: 0 4px 16px #0009;
}
.painel-camera label { margin-bottom: 4px; font-size: 11px; }
.painel-camera select { padding: 8px; font-size: 13px; }
.info-camera { font-size: 11px; margin-top: 5px; }
.zoom-box { margin-top: 7px; }
#btnCapturar { padding: 10px; margin-top: 8px; font-size: 13px; }
.resultado .label { font-size: 11px; }
.codigo-original { color: #94a3b8; font-size: 11px; margin-top: 3px; overflow-wrap: anywhere; }
#formato { font-size: 11px; margin-top: 3px; }
#motor { font-size: 10px; }
@media (max-width: 420px) { .camera-box { height: 175px; } .mira { height: 84px; } }

.botao-trocar-camera {display:none;position:absolute;z-index:8;right:8px;bottom:8px;width:auto;padding:7px 10px;margin:0;border:1px solid #64748b;border-radius:8px;background:rgba(15,23,42,.9);color:white;font-size:12px}
.painel-camera-overlay {position:absolute;z-index:9;bottom:43px;right:8px;left:8px;margin:0;padding:10px;background:rgba(30,41,59,.97);border:1px solid #64748b;box-shadow:0 4px 20px #0009}
.painel-camera-overlay[hidden]{display:none!important}
.painel-camera-overlay .info-camera{max-height:32px;overflow:hidden}
#zoomBox{display:none!important}
/* Visor sempre compacto e controles presos ao visor */
.camera-box { height: 180px !important; position: relative !important; overflow: hidden !important; }
#btnCamera.abrir-no-visor { position: absolute !important; left: 50% !important; top: 50% !important; transform: translate(-50%,-50%) !important; z-index: 7 !important; width: auto !important; margin: 0 !important; }
#btnTrocarCamera { position: absolute !important; right: 7px !important; bottom: 7px !important; top: auto !important; left: auto !important; width: auto !important; margin: 0 !important; }
#zoomBox { display: none !important; }
/* Força o seletor a permanecer sobre o vídeo, nunca abaixo dele. */
.camera-box > #painelCamera { position:absolute !important; inset:auto 8px 42px 8px !important; width:auto !important; z-index:15 !important; }
.camera-box > #btnTrocarCamera { position:absolute !important; z-index:14 !important; }
#zoomBox, #zoomBox * { visibility:hidden !important; }
#zoomBox { display:none !important; height:0 !important; padding:0 !important; margin:0 !important; }
/* Cadastro compacto: somente apresentação, sem alterar leitura ou envio */
.cadastro { margin-top: 12px; padding: 14px 12px 12px; border-radius: 12px; }
.cadastro h2 { font-size: 18px; margin-bottom: 3px; }
.cadastro .ajuda { font-size: 11px; margin-bottom: 10px; line-height: 1.35; }
.cadastro .campo { margin-top: 9px; }
.cadastro .campo label { font-size: 11px; margin-bottom: 5px; letter-spacing: .25px; }
.cadastro .campo input, .cadastro .campo select {
  min-height: 40px; padding: 8px 10px; border-radius: 8px;
  font-size: 14px; line-height: 1.25;
}
.cadastro #chassiCadastro { font-size: 15px; letter-spacing: .25px; }
.cadastro .marca-botoes { gap: 8px; }
.cadastro .marca-btn { min-height: 40px; padding: 8px; font-size: 14px; border-radius: 9px; }
.cadastro #btnDigitarManual {
  width: auto; min-height: 34px; margin-top: 6px; padding: 7px 12px;
  font-size: 11px; border-radius: 8px;
}
.cadastro #btnSalvar, .cadastro #btnNovo {
  min-height: 42px; padding: 10px; margin-top: 10px;
  font-size: 13px; border-radius: 9px;
}
.cadastro #btnNovo { margin-top: 7px; }
.cadastro #statusCadastro { margin-top: 8px; min-height: 15px; font-size: 12px; }

</style>
</head>


<body>

<div class="container">

<h1>Leitor de Código de Barras</h1>

<div class="subtitulo">
  Aponte a câmera para o código de barras
</div>


<div class="camera-box">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <button type="button" id="btnCamera" class="abrir-no-visor">ABRIR CÂMERA</button>

  <div class="mira">

    <div class="linha"></div>

  </div>

  <button type="button" id="btnTrocarCamera" class="botao-trocar-camera" aria-expanded="false">⚙ Câmera</button>
  <div class="painel-camera painel-camera-overlay" id="painelCamera" hidden>
    <label for="cameraSelect">ESCOLHER CÂMERA</label>
    <select id="cameraSelect"><option value="">Abra a câmera primeiro</option></select>
    <div class="info-camera" id="infoCamera"></div>
  </div>
  <div class="zoom-box" id="zoomBox" hidden aria-hidden="true"><input type="range" id="zoom"><span id="zoomValor">1x</span></div>
</div>


<div class="instrucao">

  Centralize todas as barras dentro
  do retângulo amarelo.

</div>



<div class="resultado">

  <div class="label">
    CÓDIGO LIDO
  </div>

  <div id="codigo">
    Aguardando...
  </div>

  <div id="codigoOriginal" class="codigo-original"></div>

  <div id="formato"></div>

  <div id="motor"></div>

</div>


<button
  id="btnCapturar"
  disabled>

  CAPTURAR E LER

</button>


<div id="mensagem">

  Abra a câmera para começar.

</div>



<div class="cadastro" id="cadastro">
  <h2>Cadastro do veículo</h2>
  <div class="ajuda">Após a leitura do código, complete os dados abaixo.</div>

  <div class="campo">
    <label>CHASSIS / CÓDIGO LIDO</label>
    <input id="chassiCadastro" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Leia ou digite o chassi...">
    <button type="button" id="btnDigitarManual">DIGITAR MANUALMENTE</button>
  </div>

  <div class="campo">
    <label>MARCA</label>
    <div class="marca-botoes">
      <button type="button" class="marca-btn" data-marca="FIAT">FIAT</button>
      <button type="button" class="marca-btn" data-marca="JEEP">JEEP</button>
    </div>
  </div>

  <div class="campo">
    <label>MODELO</label>
    <select id="modeloCadastro" disabled>
      <option value="">Selecione a marca primeiro</option>
    </select>
  </div>

  <div class="campo">
    <label>VERSÃO</label>
    <select id="versaoCadastro" disabled>
      <option value="">Selecione o modelo primeiro</option>
    </select>
  </div>

  <div class="campo">
    <label>COR</label>
    <select id="corCadastro" disabled>
      <option value="">Selecione o modelo primeiro</option>
    </select>
  </div>

  <div class="campo">
    <label>LOCALIZAÇÃO</label>
    <select id="localizacaoCadastro">
      <option value="">Selecione o pátio</option>
      <option>Pátio Caminhões</option>
      <option>Pátio 1</option>
      <option>Pátio 2</option>
      <option>Pátio Santa Genoveva</option>
    </select>
  </div>

  <button type="button" id="btnSalvar">SALVAR NA PLANILHA</button>
  <button type="button" id="btnNovo">NOVO VEÍCULO</button>
  <div id="statusCadastro" class="status-info"></div>
</div>


<canvas id="canvas"></canvas>

</div>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const btnCamera =
  document.getElementById("btnCamera");

  document.getElementById("btnCapturar");

const cameraSelect =
  document.getElementById("cameraSelect");


const btnTrocarCamera = document.getElementById("btnTrocarCamera");
const painelCamera = document.getElementById("painelCamera");
btnTrocarCamera.addEventListener("click", function() {
  painelCamera.hidden = !painelCamera.hidden;
  btnTrocarCamera.setAttribute("aria-expanded", String(!painelCamera.hidden));
});
cameraSelect.addEventListener("change", function() {
  painelCamera.hidden = true;
  btnTrocarCamera.setAttribute("aria-expanded", "false");
});

const infoCamera =
  document.getElementById("infoCamera");

const zoomBox =
  document.getElementById("zoomBox");

const zoom =
  document.getElementById("zoom");

const zoomValor =
  document.getElementById("zoomValor");

const codigo =
  document.getElementById("codigo");

const formato =
  document.getElementById("formato");

const mensagem =
  document.getElementById("mensagem");

const motor =
  document.getElementById("motor");


let detector = null;

let stream = null;

let track = null;

let intervalo = null;

let processando = false;

let ultimoCodigo = "";
let leituraConfirmada = false;
let candidatoAtual = "";
let repeticoesCandidato = 0;
let instanteCandidato = 0;
const CONFIRMACOES_NECESSARIAS = 2;
const TEMPO_CANDIDATO_MS = 1800;

function normalizarVinLido(raw) {
  const original = String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
  if (original.length !== 17 && original.length !== 18) return null;
  const vin = original.slice(0, 17);
  // Letras I, O e Q não são válidas no VIN; o caractere extra pode ser qualquer um.
  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return null;
  return { original, vin };
}

function reiniciarLeitura() {
  leituraConfirmada = false;
  candidatoAtual = "";
  repeticoesCandidato = 0;
  instanteCandidato = 0;
  processando = false;
  ultimoCodigo = "";
  codigo.innerText = "Procurando chassi...";
  const original = document.getElementById("codigoOriginal");
  if (original) original.textContent = "";
  if (track && detector) iniciarLeitura();
}


// =====================================
// CADASTRO / GOOGLE SHEETS
// =====================================
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7gLj67JSX1_I0bhOkEzCJKyJlgJei66XEICrQJKd82LrnRx7iXAcXfpoTf7-egYwNSg/exec";

const chassiCadastro = document.getElementById("chassiCadastro");
const btnDigitarManual = document.getElementById("btnDigitarManual");
const modeloCadastro = document.getElementById("modeloCadastro");
const versaoCadastro = document.getElementById("versaoCadastro");
const corCadastro = document.getElementById("corCadastro");
const localizacaoCadastro = document.getElementById("localizacaoCadastro");
const btnSalvar = document.getElementById("btnSalvar");
const btnNovo = document.getElementById("btnNovo");
const statusCadastro = document.getElementById("statusCadastro");
const marcaBotoes = Array.from(document.querySelectorAll(".marca-btn"));

let marcaSelecionada = "";


// Entrada manual do chassi quando o código de barras não puder ser lido.
btnDigitarManual.addEventListener("click", function() {
  chassiCadastro.removeAttribute("readonly");
  chassiCadastro.focus();
  chassiCadastro.select();
  statusCadastro.textContent = "Digite o chassi e depois complete o cadastro.";
  statusCadastro.className = "status-info";
});

chassiCadastro.addEventListener("input", function() {
  const inicio = this.selectionStart;
  this.value = this.value.toUpperCase().replace(/\s+/g, "");
  try {
    this.setSelectionRange(inicio, inicio);
  } catch (_) {}
});


const catalogo = {
  FIAT: {
    "MOBI": {
      versoes: ["LIKE 1.0", "TREKKING 1.0"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE"]
    },
    "ARGO": {
      versoes: ["DRIVE 1.0 MT", "DRIVE 1.3 AT", "TREKKING 1.3 MT", "TREKKING 1.3 AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "PRATA BARI"]
    },
    "CRONOS": {
      versoes: ["DRIVE 1.0", "DRIVE 1.3", "DRIVE 1.3 AT", "PRECISION 1.3 AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "CINZA SILVERSTONE", "PRATA BARI"]
    },
    "PULSE": {
      versoes: ["DRIVE 1.3 MT", "DRIVE 1.3 AT", "AUDACE T200 MHEV AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "CINZA STRATO"]
    },
    "FASTBACK": {
      versoes: ["TURBO 200 AT", "SMART DRIVE TURBO 200 AT", "AUDACE TURBO 200 MHEV AT", "IMPETUS TURBO 200 MHEV AT"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "CINZA STRATO"]
    },
    "STRADA": {
      versoes: ["ENDURANCE CABINE PLUS", "FREEDOM CABINE PLUS", "FREEDOM CABINE DUPLA", "VOLCANO CABINE DUPLA", "VOLCANO CABINE DUPLA AT", "ULTRA CABINE DUPLA", "RANCH CABINE DUPLA"],
      cores: ["BRANCO BANCHISA", "PRETO VULCANO", "VERMELHO MONTECARLO", "CINZA SILVERSTONE", "PRATA BARI"]
    },
    "TORO": {
      versoes: ["ENDURANCE T270", "FREEDOM T270", "VOLCANO T270 MHEV", "ULTRA T270 MHEV", "VOLCANO TURBODIESEL 4X4", "RANCH TURBODIESEL 4X4"],
      cores: ["BRANCO AMBIENTE", "PRETO CARBON", "VERMELHO COLORADO", "GRANITE CRYSTAL", "PRATA BILLET"]

function preencherSelect(select, itens, placeholder) {
  select.innerHTML = "";
  const inicial = document.createElement("option");
  inicial.value = "";
  inicial.textContent = placeholder;
  select.appendChild(inicial);

  itens.forEach(item => {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    select.appendChild(option);
  });

  select.disabled = itens.length === 0;
}

marcaBotoes.forEach(botao => {
  botao.addEventListener("click", function() {
    marcaSelecionada = this.dataset.marca;

    marcaBotoes.forEach(b => b.classList.remove("ativo"));
    this.classList.add("ativo");

    const modelos = Object.keys(catalogo[marcaSelecionada] || {});
    preencherSelect(modeloCadastro, modelos, "Selecione o modelo");
    preencherSelect(versaoCadastro, [], "Selecione o modelo primeiro");
    preencherSelect(corCadastro, [], "Selecione o modelo primeiro");
    statusCadastro.textContent = "";
  });
});

modeloCadastro.addEventListener("change", function() {
  const dadosModelo = catalogo[marcaSelecionada]?.[this.value];

  if (!dadosModelo) {
    preencherSelect(versaoCadastro, [], "Selecione o modelo primeiro");
    preencherSelect(corCadastro, [], "Selecione o modelo primeiro");
    return;
  }

  preencherSelect(versaoCadastro, dadosModelo.versoes, "Selecione a versão");
  preencherSelect(corCadastro, dadosModelo.cores, "Selecione a cor");
});

function prepararNovoCadastro() {
  chassiCadastro.value = "";
  chassiCadastro.placeholder = "Leia ou digite o chassi...";
  marcaSelecionada = "";
  marcaBotoes.forEach(b => b.classList.remove("ativo"));
  preencherSelect(modeloCadastro, [], "Selecione a marca primeiro");
  preencherSelect(versaoCadastro, [], "Selecione o modelo primeiro");
  preencherSelect(corCadastro, [], "Selecione o modelo primeiro");
  localizacaoCadastro.value = "";
  statusCadastro.textContent = "";
  statusCadastro.className = "status-info";
  reiniciarLeitura();
  btnCapturar.textContent = "CAPTURAR E LER";
  formato.innerText = "";
  document.getElementById("codigoOriginal").textContent = "";
}

btnNovo.addEventListener("click", prepararNovoCadastro);

btnSalvar.addEventListener("click", async function() {
  const dados = {
    marca: marcaSelecionada,
    chassi: chassiCadastro.value.trim(),
    modelo: modeloCadastro.value,
    versao: versaoCadastro.value,
    cor: corCadastro.value,
    localizacao: localizacaoCadastro.value
  };

  if (!dados.chassi || !dados.marca || !dados.modelo || !dados.versao || !dados.cor || !dados.localizacao) {
    statusCadastro.textContent = "Complete todos os campos antes de salvar.";
    statusCadastro.className = "status-erro";
    return;
  }

  btnSalvar.disabled = true;
  btnSalvar.textContent = "SALVANDO...";
  statusCadastro.textContent = "Enviando dados para a planilha...";
  statusCadastro.className = "status-info";

  try {
    // text/plain evita preflight CORS no Apps Script.
    const resposta = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(dados),
      redirect: "follow"
    });

    const texto = await resposta.text();
    let resultado;

    try {
      resultado = JSON.parse(texto);
    } catch (_) {
      throw new Error("O Apps Script não retornou uma resposta JSON válida.");
    }

    if (!resultado.sucesso) {
      throw new Error(resultado.mensagem || "Não foi possível cadastrar o veículo.");
    }

    statusCadastro.textContent = resultado.mensagem || "Veículo cadastrado com sucesso!";
    statusCadastro.className = "status-ok";

    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

    setTimeout(prepararNovoCadastro, 1800);

  } catch (erro) {
    console.error(erro);
    statusCadastro.textContent = "Erro ao salvar: " + erro.message;
    statusCadastro.className = "status-erro";
  } finally {
    btnSalvar.disabled = false;
    btnSalvar.textContent = "SALVAR NA PLANILHA";
  }
});



// =====================================
// BARCODE DETECTOR
// =====================================

async function prepararDetector() {

  if (!("BarcodeDetector" in window)) {

    throw new Error(
      "BarcodeDetector não disponível."
    );

  }


  const suportados =
    await BarcodeDetector.getSupportedFormats();


  const desejados = [

    "ean_13",
    "ean_8",
    "code_128",
    "code_39",
    "code_93",
    "codabar",
    "itf",
    "upc_a",
    "upc_e"

  ];


  const formatosValidos =
    desejados.filter(
      f => suportados.includes(f)
    );


  detector =
    new BarcodeDetector({

      formats: formatosValidos

    });


  motor.innerText =
    "Motor: leitor nativo do navegador";

}


// =====================================
// PARAR CÂMERA
// =====================================

function pararCamera() {

  if (intervalo) {

    clearInterval(intervalo);

    intervalo = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        t => t.stop()
      );

  }


  stream = null;
  track = null;

}


// =====================================
// PRIMEIRA ABERTURA
// =====================================

btnCamera.addEventListener(
  "click",
  iniciar
);


async function iniciar() {

  btnCamera.disabled = true;

  btnCamera.innerText =
    "ABRINDO CÂMERA...";


  mensagem.innerText =
    "Solicitando acesso à câmera...";


  try {

    await prepararDetector();


    /*
      Primeiro abrimos qualquer câmera traseira.
      Isso libera os nomes das câmeras para o navegador.
    */

    const temporaria =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      });


    temporaria
      .getTracks()
      .forEach(
        t => t.stop()
      );


    await carregarListaCameras();


    const cameraSalva =
      localStorage.getItem(
        "cameraPreferida"
      );


    let cameraInicial = "";


    if (
      cameraSalva &&
      Array.from(
        cameraSelect.options
      ).some(
        option =>
          option.value === cameraSalva
      )
    ) {

      cameraInicial =
        cameraSalva;

    } else {

      /*
        Começamos pela primeira câmera
        traseira encontrada.
      */

      const primeira =
        Array.from(
          cameraSelect.options
        ).find(
          option =>
            option.value
        );


      if (primeira) {

        cameraInicial =
          primeira.value;

      }

    }


    if (!cameraInicial) {

      throw new Error(
        "Nenhuma câmera encontrada."
      );

    }


    cameraSelect.value =
      cameraInicial;


    await abrirCamera(cameraInicial);
    localStorage.setItem("cameraPreferida", cameraInicial);


    btnCamera.style.display = "none";
    btnTrocarCamera.style.display = "block";


    btnCapturar.disabled =
      false;


  } catch (erro) {

    console.error(erro);


    btnCamera.disabled =
      false;


    btnCamera.style.display = "block";
    btnTrocarCamera.style.display = "none";
    btnCamera.innerText =
      "TENTAR NOVAMENTE";


    mensagem.innerText =
      "Erro: " + erro.message;

  }

}


// =====================================
// LISTAR CÂMERAS
// =====================================

async function carregarListaCameras() {

  const dispositivos =
    await navigator.mediaDevices
      .enumerateDevices();


  const cameras =
    dispositivos.filter(
      d => d.kind === "videoinput"
    );


  cameraSelect.innerHTML = "";


  cameras.forEach(
    (camera, indice) => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        camera.deviceId;


      option.textContent =
        camera.label ||
        "Câmera " + (indice + 1);


      cameraSelect.appendChild(
        option
      );

    }
  );


  if (cameras.length === 0) {

    cameraSelect.innerHTML =
      "<option>Nenhuma câmera encontrada</option>";

  }

}


// =====================================
// TROCAR CÂMERA
// =====================================

cameraSelect.addEventListener(
  "change",
  async function() {

    const deviceId =
      cameraSelect.value;


    if (!deviceId) {
      return;
    }


    mensagem.innerText =
      "Trocando câmera...";


    try {
      await abrirCamera(deviceId);
      localStorage.setItem("cameraPreferida", deviceId);
    } catch (erro) {
      mensagem.innerText = "Não foi possível trocar a câmera: " + erro.message;
      btnCamera.style.display = "block";
    btnTrocarCamera.style.display = "none";
      btnCamera.disabled = false;
      btnCamera.innerText = "TENTAR NOVAMENTE";
    }

  }
);


// =====================================
// ABRIR CÂMERA ESPECÍFICA
// =====================================

async function abrirCamera(
  deviceId
) {

  pararCamera();
  leituraConfirmada = false;
  candidatoAtual = "";
  repeticoesCandidato = 0;

  codigo.innerText =
    "Procurando código...";


  formato.innerText = "";


  zoomBox.style.display =
    "none";


  stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio: false,

        video: {

          deviceId: {
            exact: deviceId
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });


  video.srcObject =
    stream;


  await video.play();


  track =
    stream.getVideoTracks()[0];


  configurarCamera();


  btnCamera.style.display = "none";
  mensagem.innerText =
    "Câmera ativa. Procurando código...";


  iniciarLeitura();

}


// =====================================
// RECURSOS DA CÂMERA
// =====================================

async function configurarCamera() {

  if (!track) {
    return;
  }


  const settings =
    track.getSettings();


  let texto =
    "Ativa: " +
    (track.label || "Câmera");


  if (
    settings.width &&
    settings.height
  ) {

    texto +=
      "<br>Resolução: " +
      settings.width +
      " × " +
      settings.height;

  }


  infoCamera.innerHTML =
    texto;


  let capacidades = {};


  try {

    capacidades =
      track.getCapabilities();

  } catch (erro) {

    console.log(erro);

  }


  /*
    Tentar foco contínuo
  */

  try {

    if (
      capacidades.focusMode &&
      capacidades.focusMode.includes(
        "continuous"
      )
    ) {

      await track.applyConstraints({

        advanced: [

          {
            focusMode: "continuous"
          }

        ]

      });

    }

  } catch (erro) {

    console.log(
      "Foco contínuo não disponível."
    );

  }


  /*
    Configurar zoom
  */

  if (capacidades.zoom) {

    zoom.min =
      capacidades.zoom.min;

    zoom.max =
      capacidades.zoom.max;

    zoom.step =
      capacidades.zoom.step || 0.1;


    const zoomAtual =
      settings.zoom ||
      capacidades.zoom.min;


    zoom.value =
      zoomAtual;


    zoomValor.innerText =
      Number(
        zoomAtual
      ).toFixed(1) + "x";


    zoomBox.style.display =
      "block";

  }

}


// =====================================
// ZOOM
// =====================================

zoom.addEventListener(
  "input",
  async function() {

    if (!track) {
      return;
    }


    const valor =
      Number(
        zoom.value
      );


    zoomValor.innerText =
      valor.toFixed(1) + "x";


    try {

      await track.applyConstraints({

        advanced: [

          {
            zoom: valor
          }

        ]

      });

    } catch (erro) {

      console.log(
        "Erro no zoom:",
        erro
      );

    }

  }
);


// =====================================
// LEITURA AUTOMÁTICA
// =====================================

function iniciarLeitura() {
  if (intervalo) clearInterval(intervalo);
  if (leituraConfirmada) return;

  intervalo = setInterval(async function() {
    if (processando || leituraConfirmada || !detector || video.readyState < 2) return;
    processando = true;
    try {
      const resultados = await detector.detect(video);
      analisarResultados(resultados, false);
    } catch (erro) {
      console.log("Falha de leitura:", erro);
    } finally {
      processando = false;
    }
  }, 200);
}

function analisarResultados(resultados, capturaManual) {
  if (leituraConfirmada || !Array.isArray(resultados)) return false;
  const candidatos = resultados
    .map(item => ({ item, dados: normalizarVinLido(item.rawValue) }))
    .filter(x => x.dados);

  if (!candidatos.length) {
    if (capturaManual) mensagem.innerText = "Nenhum chassi válido encontrado. Centralize as barras do chassi.";
    return false;
  }

  // Prioriza a região central do quadro se o navegador informar coordenadas.
  const centroX = video.videoWidth / 2;
  const centroY = video.videoHeight / 2;
  candidatos.sort((a, b) => {
    const distancia = x => {
      const r = x.item.boundingBox;
      if (!r || !video.videoWidth) return 0;
      return Math.hypot(r.x + r.width / 2 - centroX, r.y + r.height / 2 - centroY);
    };
    return distancia(a) - distancia(b);
  });

  const escolhido = candidatos[0];
  const agora = Date.now();
  if (escolhido.dados.vin === candidatoAtual && agora - instanteCandidato < TEMPO_CANDIDATO_MS) {
    repeticoesCandidato++;
  } else {
    candidatoAtual = escolhido.dados.vin;
    repeticoesCandidato = 1;
  }
  instanteCandidato = agora;

  if (repeticoesCandidato >= CONFIRMACOES_NECESSARIAS) {
    confirmarChassi(escolhido.item, escolhido.dados);
    return true;
  }
  mensagem.innerText = "Chassi detectado. Mantenha a câmera firme para confirmar...";
  return false;
}

function confirmarChassi(item, dados) {
  if (leituraConfirmada) return;
  leituraConfirmada = true;
  if (intervalo) {
    clearInterval(intervalo);
    intervalo = null;
  }
  ultimoCodigo = dados.vin;
  codigo.innerText = dados.vin;
  const original = document.getElementById("codigoOriginal");
  if (original) original.textContent = dados.original.length === 18
    ? "Capturado: " + dados.original + " • último caractere ignorado" : "";
  chassiCadastro.value = dados.vin;
  formato.innerText = "Formato: " + (item.format || "identificado");
  mensagem.innerText = "Chassi confirmado! Confira os 17 caracteres e complete o cadastro.";
  btnCapturar.textContent = "LER OUTRO CHASSI";
  btnCapturar.disabled = false;
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
}

// =====================================
// CAPTURAR E LER
// =====================================

btnCapturar.addEventListener(
  "click",
  capturar
);


async function capturar() {
  if (leituraConfirmada) {
    btnCapturar.textContent = "CAPTURAR E LER";
    reiniciarLeitura();
    mensagem.innerText = "Procurando novo chassi...";
    return;
  }

  if (
    !detector ||
    !video.videoWidth
  ) {

    return;

  }


  mensagem.innerText =
    "Capturando e analisando...";


  const largura =
    video.videoWidth;

  const altura =
    video.videoHeight;


  canvas.width =
    largura;

  canvas.height =
    altura;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    video,
    0,
    0,
    largura,
    altura
  );


  try {

    const resultados =
      await detector.detect(
        canvas
      );


    if (resultados && resultados.length > 0) {
      analisarResultados(resultados, true);
    } else {

      mensagem.innerText = "Nenhum código identificado nesta captura.";

    }


  } catch (erro) {

    mensagem.innerText =
      "Erro: " + erro.message;

  }

}
